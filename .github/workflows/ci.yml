name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  release-check:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Release readiness
        run: npm run release:check
